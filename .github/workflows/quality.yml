name: Quality checks

on:
  push:
    branches:
      - main
      - refresh/proforientir-modernization
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check server.js
      - name: Validate JSON data
        run: |
          node -e "JSON.parse(require('fs').readFileSync('professions.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('universities.json', 'utf8'))"
      - name: Run smoke tests
        run: npm test
