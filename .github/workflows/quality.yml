name: Quality checks

on:
  push:
    branches:
      - main
      - refresh/proforientir-modernization
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check server.js
      - name: Validate JSON data
        run: |
          node -e "JSON.parse(require('fs').readFileSync('professions.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('universities.json', 'utf8'))"
      - name: Run smoke tests
        run: npm test
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 lighthouse@13.6.0
          npx playwright install --with-deps chromium
      - name: Run responsive and interaction checks
        run: node tests/responsive-e2e.cjs
      - name: Run image and mobile performance audit
        run: node tests/performance-audit.cjs
      - name: Run Lighthouse mobile audit
        run: node tests/lighthouse-audit.cjs
      - name: Upload responsive and performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proforientir-quality-reports
          path: |
            artifacts/*.png
            artifacts/performance-report.json
            artifacts/commons-attribution-report.json
            artifacts/compression-report.json
            artifacts/lighthouse-mobile.json
            artifacts/lighthouse-mobile.html
          if-no-files-found: ignore
